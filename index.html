<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KND Stock Checker — Real-time Inventory Lookup</title>
    <meta name="description" content="Instantly check product stock levels on Karz and Dolls. Paste URLs, get real-time inventory data.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Trimmed from 7 weights (300-800) to 4 actually used (400,600,700,800) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome: load only solid + regular subsets instead of all.min.css (~77% smaller) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/solid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/regular.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Warm DNS for SheetJS CDN (loaded lazily on first Upload click) -->
    <link rel="dns-prefetch" href="https://cdn.sheetjs.com">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-mesh" aria-hidden="true">
        <div class="mesh-orb mesh-orb--1"></div>
        <div class="mesh-orb mesh-orb--2"></div>
        <div class="mesh-orb mesh-orb--3"></div>
        <div class="mesh-grain"></div>
    </div>

    <div class="dashboard">
        <!-- ─── Left Sidebar (sticky) ─── -->
        <aside class="sidebar" id="sidebar">
            <!-- Brand -->
            <div class="sidebar__top">
                <nav class="topbar">
                    <div class="topbar__brand">
                        <div class="topbar__logo" aria-label="KND Logo">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        </div>
                        <span class="topbar__title">KND Stock</span>
                    </div>
                    <button type="button" id="theme-toggle" class="topbar__btn" aria-label="Toggle theme">
                        <i class="fa-solid fa-moon" id="theme-icon"></i>
                    </button>
                </nav>

                <!-- Hero -->
                <header class="hero">
                    <div class="hero__badge">
                        <span class="hero__badge-dot"></span>
                        Real-time inventory
                    </div>
                    <h1 class="hero__title">Check Stock <span class="hero__title--accent">Instantly</span></h1>
                    <p class="hero__subtitle">Paste <strong>karzanddolls.com</strong> product URLs to get live stock counts.</p>
                </header>

                <!-- Form -->
                <form id="check-form" class="stock-form" autocomplete="off">
                    <div class="form-card">
                        <div class="form-card__header">
                            <div class="form-card__icon">
                                <i class="fa-solid fa-link"></i>
                            </div>
                            <div>
                                <h2 class="form-card__title">Product URLs</h2>
                                <p class="form-card__desc">One URL per line</p>
                            </div>
                        </div>

                        <div class="url-chips-container" id="url-chips-container">
                            <div class="url-chips-scroll" id="url-chips-scroll">
                                <div class="url-chips-list" id="url-chips-list">
                                    <!-- Chips injected dynamically -->
                                </div>
                                <div class="url-input-row">
                                    <input
                                        type="text"
                                        id="product-urls-input"
                                        class="url-inline-input"
                                        placeholder="Paste or type URLs here…"
                                        spellcheck="false"
                                        autocomplete="off"
                                    />
                                </div>
                            </div>
                            <div class="url-chips-footer">
                                <span class="url-counter" id="url-counter">0 URLs</span>
                                <div class="url-chips-footer__actions">
                                    <button type="button" class="url-paste-btn" id="paste-btn" title="Paste from clipboard">
                                        <i class="fa-regular fa-clipboard"></i>
                                        <span>Paste</span>
                                    </button>
                                    <button type="button" class="url-paste-btn" id="upload-btn" title="Upload CSV, TXT, or Excel file">
                                        <i class="fa-solid fa-file-arrow-up"></i>
                                        <span>Upload</span>
                                    </button>
                                    <input type="file" id="file-upload-input" accept=".csv,.txt,.xlsx,.xls" style="display:none;" />
                                </div>
                                <span class="char-counter" id="char-counter">0 chars</span>
                            </div>
                        </div>
                        <!-- Hidden textarea to maintain form compatibility -->
                        <textarea id="product-urls" style="display:none;" required></textarea>

                        <div id="notification-area" class="notification hidden">
                            <i class="notification__icon fa-solid fa-circle-info"></i>
                            <span class="notification__text"></span>
                        </div>

                        <div class="form-actions">
                            <button type="button" id="clear-btn" class="btn btn--ghost hidden">
                                <i class="fa-solid fa-xmark"></i>
                                <span>Clear</span>
                            </button>
                            <button type="submit" id="submit-btn" class="btn btn--primary">
                                <span class="btn__text">Check Stock</span>
                                <i class="fa-solid fa-arrow-right btn__icon"></i>
                                <div class="btn__loader hidden">
                                    <div class="btn__spinner"></div>
                                </div>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Sidebar footer -->
            <footer class="sidebar__footer">
                <p>Built with <i class="fa-solid fa-bolt"></i> Python & FastAPI</p>
            </footer>
        </aside>

        <!-- ─── Main Content (results) ─── -->
        <main class="main-panel" id="main-panel">
            <div class="main-panel__header hidden" id="results-header">
                <h2 class="results-header__title">
                    <i class="fa-solid fa-chart-bar"></i>
                    Results
                </h2>
                <span class="results-header__count" id="results-count"></span>
            </div>

            <div class="main-panel__empty" id="empty-state">
                <div class="empty-state">
                    <div class="empty-state__icon">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <h3 class="empty-state__title">No results yet</h3>
                    <p class="empty-state__desc">Paste product URLs on the left and hit <strong>Check Stock</strong> to see inventory data here.</p>
                </div>
            </div>

            <div id="results-grid" class="results-grid">
                <!-- Result cards injected dynamically -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
