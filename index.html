<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>KND Stock Checker — Live Inventory Lookup</title>
    <meta name="description" content="Check product stock counts on Karz and Dolls instantly. Search product names or paste links.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/solid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/regular.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="dns-prefetch" href="https://cdn.sheetjs.com">
</head>

<body>
    <div class="bg-mesh" aria-hidden="true">
        <div class="mesh-orb mesh-orb--1"></div>
        <div class="mesh-orb mesh-orb--2"></div>
        <div class="mesh-orb mesh-orb--3"></div>
        <div class="mesh-grain"></div>
    </div>

    <div class="app-layout">
        <header class="app-header">
            <div class="header-brand">
                <div class="header-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                        <line x1="12" y1="22.08" x2="12" y2="12"/>
                    </svg>
                </div>
                <span class="header-title">KND Stock Checker</span>
            </div>

            <div class="steps-banner">
                <div class="step-item">
                    <span class="step-num">1</span>
                    <span>Type name or paste link</span>
                </div>
                <i class="fa-solid fa-chevron-right step-arrow"></i>
                <div class="step-item">
                    <span class="step-num">2</span>
                    <span>Tap Check Stock</span>
                </div>
                <i class="fa-solid fa-chevron-right step-arrow"></i>
                <div class="step-item">
                    <span class="step-num">3</span>
                    <span>See live stock</span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <form id="check-form" class="super-form" autocomplete="off">
                <div class="super-bar-card">
                    <div class="super-bar-row">
                        <div class="super-input-wrapper">
                            <i class="fa-solid fa-magnifying-glass super-search-icon"></i>
                            <input type="text" id="product-urls-input" class="super-input"
                                placeholder="Type product name (e.g. Ronin, Mustang) or paste link here…" spellcheck="false" autocomplete="off" />
                            <div id="knd-search-dropdown" class="search-dropdown hidden">
                                <div id="knd-search-results" class="search-dropdown-list"></div>
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="super-btn">
                            <span class="btn__text">Check Stock</span>
                            <i class="fa-solid fa-bolt btn__icon"></i>
                            <div class="btn__loader hidden" id="btn-loader"></div>
                        </button>
                    </div>

                    <div class="batch-toggle-bar">
                        <button type="button" id="toggle-batch-btn" class="batch-toggle-btn">
                            <i class="fa-solid fa-layer-group"></i>
                            <span id="batch-toggle-text">Multiple links queued (0)</span>
                            <i class="fa-solid fa-chevron-down chevron-icon" id="batch-chevron"></i>
                        </button>
                    </div>

                    <div id="batch-panel" class="batch-panel hidden">
                        <div class="url-chips-container" id="url-chips-container">
                            <div class="url-chips-scroll" id="url-chips-scroll">
                                <div class="url-chips-list" id="url-chips-list" role="listbox" aria-label="Added URLs"></div>
                            </div>
                            <div class="url-chips-footer">
                                <span class="url-counter" id="url-counter">0 Links Queued</span>
                                <div class="url-chips-footer__actions">
                                    <button type="button" class="url-paste-btn" id="paste-btn" title="Paste from clipboard">
                                        <i class="fa-regular fa-clipboard"></i>
                                        <span>Paste Link</span>
                                    </button>
                                    <button type="button" class="url-paste-btn" id="upload-btn" title="Upload CSV, TXT, or Excel file">
                                        <i class="fa-solid fa-file-arrow-up"></i>
                                        <span>Upload File</span>
                                    </button>
                                    <input type="file" id="file-upload-input" accept=".csv,.txt,.xlsx,.xls" style="display:none;" />
                                    <button type="button" id="clear-btn" class="url-paste-btn btn-clear">
                                        <i class="fa-solid fa-trash-can"></i>
                                        <span>Clear</span>
                                    </button>
                                </div>
                                <span class="char-counter" id="char-counter">0 chars</span>
                            </div>
                        </div>
                    </div>
                </div>
                <textarea id="product-urls" style="display:none;" required></textarea>

                <div id="notification-area" class="notification hidden">
                    <i class="notification__icon fa-solid fa-circle-exclamation"></i>
                    <span class="notification__msg" id="notification-msg"></span>
                </div>
            </form>

            <section class="results-section">
                <div class="results-header hidden" id="results-header">
                    <div class="results-header__left">
                        <h2 class="results-header__title">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            Stock Results
                        </h2>
                        <span class="results-header__count" id="results-count"></span>
                    </div>
                    <div class="results-header__actions">
                        <div class="progress-indicator hidden" id="progress-indicator">
                            <div class="progress-bar">
                                <div class="progress-bar__fill" id="progress-bar-fill"></div>
                            </div>
                            <span class="progress-text" id="progress-text">0 / 0</span>
                        </div>
                        <button type="button" id="retry-failed-btn" class="btn btn--ghost btn--sm hidden" title="Retry all failed lookups">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Retry Failed</span>
                        </button>
                        <button type="button" id="export-csv-btn" class="btn btn--ghost btn--sm hidden" title="Export results as CSV">
                            <i class="fa-solid fa-file-csv"></i>
                            <span>Export CSV</span>
                        </button>
                    </div>
                </div>



                <div class="empty-state-card" id="empty-state">
                    <div class="empty-state-icon">
                        <i class="fa-solid fa-magnifying-glass-location"></i>
                    </div>
                    <h3 class="empty-state-title">Ready to Check Inventory</h3>
                    <p class="empty-state-desc">Type a product name or paste a Karz and Dolls link above and tap <strong>Check Stock</strong>.</p>
                </div>

                <div id="results-grid" class="results-grid"></div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Built for Karz and Dolls | Live Inventory Lookup</p>
        </footer>
    </div>

    <script src="script.js?v=3"></script>
</body>

</html>
